<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RNG Pedras</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#07101d;color:#fff;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.top{display:flex;justify-content:space-between;gap:10px;padding:14px;flex-wrap:wrap}
.card{background:#0d1828dd;border:1px solid #2a405b;border-radius:14px;padding:10px 14px;box-shadow:0 6px 25px #0008}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stat b{display:block;font-size:18px}.small{font-size:12px;color:#a9b8c9}
#rollBox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;min-width:320px}
#name{font-size:44px;font-weight:900;text-shadow:0 0 22px currentColor;letter-spacing:1px}
#rarity{font-size:20px;font-weight:bold;margin:5px}
button{pointer-events:auto;border:0;border-radius:12px;padding:13px 22px;font-weight:900;cursor:pointer;background:#fff;color:#07101d}
button:hover{transform:scale(1.04)}#roll{margin-top:12px;font-size:17px}
#help{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);text-align:center;color:#b9c6d5}
.hp{height:6px;background:#1b2635;border-radius:10px;overflow:hidden;margin-top:5px}.hp>i{display:block;height:100%;background:#58e36e}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;mix-blend-mode:screen}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translate(8px,-5px)}50%{transform:translate(-8px,5px)}75%{transform:translate(5px,3px)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="ui">
 <div class="top">
  <div class="card"><div class="small">APELIDO ATUAL</div><div id="current">Nicolas — COMUM</div></div>
  <div class="stats">
   <div class="card stat"><span class="small">PONTOS</span><b id="score">0</b></div>
   <div class="card stat"><span class="small">PEDRAS</span><b id="kills">0</b></div>
   <div class="card stat"><span class="small">DANO</span><b id="dmg">8</b></div>
   <div class="card stat"><span class="small">VIDA</span><b id="life">100</b></div>
  </div>
 </div>
 <div id="rollBox">
  <div id="rarity">COMUM</div><div id="name">Nicolas</div>
  <button id="roll">🎲 ROLAR RNG</button>
 </div>
 <div id="help">Clique/tap nas pedras para atirar • Derrote uma pedra = +100 pontos • Rolar troca seu poder</div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),flash=document.getElementById('flash');
let W,H,score=0,kills=0,shots=[],rocks=[],particles=[],last=0,spawn=0,shake=0;
const rarities=[
 {key:'comum',label:'COMUM',chance:50,color:'#fff',names:['Nicolas','Henrico','Thales','Pedro'],damage:8,life:100,rate:1},
 {key:'raro',label:'RARO',chance:25,color:'#35a7ff',names:['Wlissys','Jaque','Bruno','Bagre'],damage:14,life:130,rate:1.1},
 {key:'epico',label:'ÉPICO',chance:15,color:'#b45cff',names:['Jadrian','Felipin','Kenedy','Vini'],damage:22,life:165,rate:1.2},
 {key:'lendario',label:'LENDÁRIO',chance:5,color:'#ff9b21',names:['Leo','Lipão','Jão'],damage:34,life:210,rate:1.35},
 {key:'mitico',label:'MÍTICO',chance:1,color:'#ff263c',names:['RL','FEFA'],damage:55,life:270,rate:1.55},
 {key:'secreto',label:'SECRETO',chance:.5,color:'rgb',names:['POLO'],damage:90,life:360,rate:1.8}
];
let current=rarities[0], player={x:W/2,y:H-90};
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';player.x=W/2;player.y=H-100*devicePixelRatio}
addEventListener('resize',resize);resize();
function weighted(){let r=Math.random()*96.5, sum=0;for(const x of rarities){sum+=x.chance;if(r<sum)return x}return rarities[0]}
function roll(){
 current=weighted(); const n=current.names[Math.floor(Math.random()*current.names.length)];
 document.getElementById('name').textContent=n;document.getElementById('rarity').textContent=current.label;
 document.getElementById('current').textContent=n+' — '+current.label;
 document.getElementById('name').style.color=current.color==='rgb'?'#fff':current.color;
 document.getElementById('dmg').textContent=current.damage;document.getElementById('life').textContent=current.life;
 if(current.key==='mitico'||current.key==='secreto') epicEffect(current.key);
}
document.getElementById('roll').onclick=roll;
function epicEffect(k){
 flash.style.background=k==='secreto'?'linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet)':'#ff173d';
 flash.animate([{opacity:.8},{opacity:0}],{duration:700,easing:'ease-out'});
 document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');
 for(let i=0;i<90;i++)particles.push({x:W/2,y:H/2,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,life:70,r:2+Math.random()*5,rgb:k==='secreto'});
}
function shoot(tx,ty){
 const dx=tx-player.x,dy=ty-player.y,len=Math.hypot(dx,dy)||1;
 shots.push({x:player.x,y:player.y,vx:dx/len*18,vy:dy/len*18,life:80,d:current.damage});
}
c.addEventListener('pointerdown',e=>{shoot(e.clientX*devicePixelRatio,e.clientY*devicePixelRatio)});
function spawnRock(){
 const r=28+Math.random()*28, hp=Math.round(35+score/900*10+r*1.4);
 rocks.push({x:r+Math.random()*(W-2*r),y:-r,r,hp,max:hp,vy:1.2+Math.random()*1.8});
}
function textParticle(x,y,t,col){particles.push({x,y,vx:(Math.random()-.5)*1,vy:-1.5,life:45,r:0,t,col})}
function update(){
 spawn-=1;if(spawn<=0){spawnRock();spawn=35+Math.random()*35/current.rate}
 for(const s of shots){s.x+=s.vx;s.y+=s.vy;s.life--}
 shots=shots.filter(s=>s.life>0&&s.x>-50&&s.x<W+50&&s.y>-50&&s.y<H+50);
 for(const r of rocks){r.y+=r.vy}
 for(const s of shots){
  for(const r of rocks){if(Math.hypot(s.x-r.x,s.y-r.y)<r.r+7&&r.hp>0){r.hp-=s.d;s.life=0;textParticle(r.x,r.y,'-'+s.d,'#fff');break}}
 }
 for(const r of rocks){if(r.hp<=0&&!r.dead){r.dead=true;kills++;score+=100;for(let i=0;i<18;i++)particles.push({x:r.x,y:r.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:35,r:3,rgb:false})}}
 rocks=rocks.filter(r=>!r.dead&&r.y<H+80);
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life--}
 particles=particles.filter(p=>p.life>0);
 document.getElementById('score').textContent=score;document.getElementById('kills').textContent=kills;
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const grd=ctx.createRadialGradient(W/2,H*.6,20,W/2,H*.6,Math.max(W,H)*.7);grd.addColorStop(0,'#10233a');grd.addColorStop(1,'#050b14');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#17304a';ctx.globalAlpha=.35;for(let x=0;x<W;x+=60) {ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.globalAlpha=1;
 for(const r of rocks){ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.fillStyle='#6d7480';ctx.fill();ctx.strokeStyle='#aab2bc';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#222b36';ctx.font='bold 12px Arial';ctx.textAlign='center';ctx.fillText(Math.max(0,Math.ceil(r.hp))+'/'+r.max,r.x,r.y+4);ctx.fillStyle='#e94b4b';ctx.fillRect(r.x-r.r,r.y-r.r-10,r.r*2,4);ctx.fillStyle='#48e06a';ctx.fillRect(r.x-r.r,r.y-r.r-10,(r.r*2)*Math.max(0,r.hp/r.max),4)}
 for(const s of shots){ctx.beginPath();ctx.arc(s.x,s.y,6,0,Math.PI*2);ctx.fillStyle=current.color==='rgb'?'hsl('+(Date.now()/3%360)+',100%,60%)':current.color;ctx.shadowBlur=15;ctx.shadowColor=ctx.fillStyle;ctx.fill();ctx.shadowBlur=0}
 ctx.beginPath();ctx.arc(player.x,player.y,25,0,Math.PI*2);ctx.fillStyle='#dbe8f5';ctx.fill();ctx.fillStyle='#162536';ctx.fillRect(player.x-7,player.y-30,14,28);
 for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/45);ctx.fillStyle=p.rgb?'hsl('+(Date.now()/2+p.x)%360+',100%,60%)':(p.col||'#fff');if(p.t){ctx.font='bold 14px Arial';ctx.fillText(p.t,p.x,p.y)}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
 requestAnimationFrame(loop)
}
function loop(t){update();draw();last=t}
roll();loop(0);
</script>
</body></html>
